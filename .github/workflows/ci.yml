name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Guard Wind Tunnel architecture
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "groq-server.ts" tools/wind-tunnel/oauth-gateway.ts; then
            echo "oauth-gateway.ts must launch server-v2 directly, not the legacy Groq harness"
            exit 1
          fi
          if grep -q "/workspace/nazare-hydrogen" tools/wind-tunnel/server-v2.ts; then
            echo "server-v2.ts must not use a persistent repository under /workspace"
            exit 1
          fi
          if grep -Eq "git tag .*baseline|rev-parse baseline" tools/wind-tunnel/server-v2.ts tools/wind-tunnel/bootstrap.ts; then
            echo "Wind Tunnel must not maintain a mutable local baseline tag"
            exit 1
          fi

      - name: Wind Tunnel runtime smoke test
        shell: bash
        env:
          PORT: "3100"
          WIND_TUNNEL_INTERNAL_PORT: "3101"
          WIND_TUNNEL_TOKEN: "ci-wind-tunnel-token"
          WIND_TUNNEL_APP_DIR: ${{ github.workspace }}
          WIND_TUNNEL_ROOT: ${{ runner.temp }}/wind-tunnel-state
          WIND_TUNNEL_RESULTS_DIR: ${{ runner.temp }}/wind-tunnel-results
          WIND_TUNNEL_RUNTIME_DIR: ${{ runner.temp }}/wind-tunnel-runtime
          WIND_TUNNEL_SOURCE_SHA: ${{ github.sha }}
          RAILWAY_GIT_COMMIT_SHA: ${{ github.sha }}
          RAILWAY_ENVIRONMENT: "ci"
        run: |
          set -euo pipefail
          npx tsx tools/wind-tunnel/bootstrap.ts >"$RUNNER_TEMP/wind-tunnel.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat "$RUNNER_TEMP/wind-tunnel.log" || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health >"$RUNNER_TEMP/health.json"; then
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Wind Tunnel exited before becoming healthy"
              exit 1
            fi
            sleep 1
          done

          test -s "$RUNNER_TEMP/health.json"
          cat "$RUNNER_TEMP/health.json"

          node - <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/health.json', 'utf8'));
          const upstream = health.upstream ?? health;
          const expectedSha = process.env.GITHUB_SHA;
          if (!upstream.ok) throw new Error(`health not ok: ${JSON.stringify(health)}`);
          if (upstream.controller !== 'server-v2') throw new Error(`wrong controller: ${upstream.controller}`);
          if (upstream.sourceSha !== expectedSha) throw new Error(`source SHA mismatch: ${upstream.sourceSha} != ${expectedSha}`);
          if (upstream.railwaySha !== expectedSha) throw new Error(`railway SHA mismatch: ${upstream.railwaySha} != ${expectedSha}`);
          if (upstream.provider !== 'vercel-ai-gateway') throw new Error(`wrong provider: ${upstream.provider}`);
          if (upstream.model !== 'openai/gpt-oss-20b') throw new Error(`wrong model: ${upstream.model}`);
          NODE
