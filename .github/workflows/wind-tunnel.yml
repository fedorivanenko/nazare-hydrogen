name: Run eve Wind Tunnel

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: number
      task:
        description: Repo-relative Wind Tunnel task spec
        required: true
        default: experiments/luna-operability/task-02-marketing-consent.json
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: wind-tunnel-${{ github.event.pull_request.number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  run:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          sha=$(jq -r '.head.sha' <<<"$response")
          repo=$(jq -r '.head.repo.full_name' <<<"$response")
          test "$repo" = "$GITHUB_REPOSITORY"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout task definition
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}
          sparse-checkout: ${{ inputs.task || 'experiments/luna-operability/task-02-marketing-consent.json' }}
          sparse-checkout-cone-mode: false

      - name: Run mutation task
        id: eve
        env:
          EVE_URL: ${{ vars.EVE_WIND_TUNNEL_URL }}
          EVE_TOKEN: ${{ secrets.WIND_TUNNEL_TOKEN }}
          SUBJECT_REPO: ${{ steps.pr.outputs.repo }}
          SUBJECT_SHA: ${{ steps.pr.outputs.sha }}
          TASK_PATH: ${{ inputs.task || 'experiments/luna-operability/task-02-marketing-consent.json' }}
        run: |
          set -euo pipefail
          test -n "$EVE_URL"
          test -n "$EVE_TOKEN"
          jq -e '.prepare and .agent.prompt and .verify' "$TASK_PATH" >/dev/null
          task=$(jq -c '.' "$TASK_PATH")
          jq -nc \
            --arg operationId "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --arg workspaceId "$SUBJECT_REPO" \
            --arg repository "$SUBJECT_REPO" \
            --arg sourceSha "$SUBJECT_SHA" \
            --argjson task "$task" \
            '{operationId:$operationId,workspaceId:$workspaceId,repository:$repository,sourceSha:$sourceSha,task:$task,trigger:{provider:"github-actions"}}' \
            > "$RUNNER_TEMP/eve-request.json"
          response=$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $EVE_TOKEN" -H "Content-Type: application/json" \
            "$EVE_URL/api/runs" --data-binary @"$RUNNER_TEMP/eve-request.json")
          run_id=$(jq -r '.runId' <<<"$response")
          session_id=$(jq -r '.sessionId' <<<"$response")
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
          cancel_session() {
            curl --silent --show-error \
              -X POST -H "Authorization: Bearer $EVE_TOKEN" -H "Content-Type: application/json" \
              "$EVE_URL/eve/v1/session/$session_id/cancel" --data '{"tasks":true}' >/dev/null || true
          }
          trap 'cancel_session; exit 130' INT TERM
          detail="$RUNNER_TEMP/eve-run.json"
          status=""
          for attempt in $(seq 1 300); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $EVE_TOKEN" "$EVE_URL/api/runs/$run_id" > "$detail"
            status=$(jq -r '.run.status' "$detail")
            [[ "$status" =~ ^(completed|failed|cancelled)$ ]] && break
            sleep 2
          done
          trap - INT TERM
          [[ "$status" =~ ^(completed|failed|cancelled)$ ]] || {
            echo "Wind Tunnel run did not reach a terminal state" >&2
            cancel_session
            exit 1
          }
          jq -c '.events[]' "$detail" > "$RUNNER_TEMP/eve-events.ndjson"
          result=$(jq -c '.run.result' "$detail")
          jq -n \
            --arg runId "$run_id" \
            --arg sessionId "$session_id" \
            --argjson result "$result" \
            '{runId:$runId,sessionId:$sessionId,result:$result}' \
            > "$RUNNER_TEMP/eve-result.json"
          cat "$RUNNER_TEMP/eve-result.json"
          test "$(jq -r '.result.passed' "$RUNNER_TEMP/eve-result.json")" = true

      - name: Publish summary
        if: always() && steps.eve.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.eve.outputs.run_id }}
          SESSION_ID: ${{ steps.eve.outputs.session_id }}
          TASK_PATH: ${{ inputs.task || 'experiments/luna-operability/task-02-marketing-consent.json' }}
          SHA: ${{ steps.pr.outputs.sha }}
          DASHBOARD_URL: https://nazare-wind-tunnel-dashboard.vercel.app
        run: |
          {
            echo "## Nazare Wind Tunnel"
            echo
            echo "- Run: \`$RUN_ID\`"
            echo "- Eve session: [\`$SESSION_ID\`]($DASHBOARD_URL/runs/$SESSION_ID)"
            echo "- Source: \`$SHA\`"
            echo "- Task: \`$TASK_PATH\`"
            echo "- Transport: repository + immutable SHA (no source archive)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wind-tunnel-${{ steps.eve.outputs.run_id || github.run_id }}
          path: |
            ${{ runner.temp }}/eve-result.json
            ${{ runner.temp }}/eve-events.ndjson
          if-no-files-found: warn
          retention-days: 30
