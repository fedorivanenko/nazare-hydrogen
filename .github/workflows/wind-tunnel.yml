name: Run eve Wind Tunnel

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: number
      experiment:
        description: Repo-relative experiment definition
        required: true
        default: experiments/luna-operability/experiment-02-marketing-consent.json
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          sha=$(jq -r '.head.sha' <<<"$response")
          repo=$(jq -r '.head.repo.full_name' <<<"$response")
          test "$repo" = "$GITHUB_REPOSITORY"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Validate and archive source
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          node scripts/lint-wind-tunnel-experiments.mjs "$EXPERIMENT"
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD

      - name: Run isolated eve agent
        id: eve
        env:
          EVE_URL: ${{ vars.EVE_WIND_TUNNEL_URL }}
          EVE_TOKEN: ${{ secrets.WIND_TUNNEL_TOKEN }}
          SUBJECT_REPO: ${{ steps.pr.outputs.repo }}
          SUBJECT_SHA: ${{ steps.pr.outputs.sha }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          test -n "$EVE_URL"
          test -n "$EVE_TOKEN"
          archive=$(base64 -w 0 "$RUNNER_TEMP/source.tar.gz")
          message="Implement Wind Tunnel experiment $EXPERIMENT for $SUBJECT_REPO at exact source SHA $SUBJECT_SHA. First call prepare_subject with this experiment path. After implementation call finish_run."
          jq -nc \
            --arg message "$message" \
            --arg archive "$archive" \
            --arg operationId "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --arg repository "$SUBJECT_REPO" \
            --arg sourceSha "$SUBJECT_SHA" \
            --arg experiment "$EXPERIMENT" \
            '{operationId:$operationId,message:[{type:"text",text:$message},{type:"file",data:("data:application/gzip;base64,"+$archive),mediaType:"application/gzip",filename:"source.tar.gz"}],clientContext:{repository:$repository,sourceSha:$sourceSha,experiment:$experiment,runtime:"eve@0.52.5",sandbox:"vercel"}}' \
            > "$RUNNER_TEMP/eve-request.json"
          response=$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $EVE_TOKEN" -H "Content-Type: application/json" \
            "$EVE_URL/eve/v1/session" --data-binary @"$RUNNER_TEMP/eve-request.json")
          session_id=$(jq -r '.sessionId' <<<"$response")
          [[ "$session_id" == wrun_* ]]
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
          stream="$RUNNER_TEMP/eve-events.ndjson"
          for attempt in $(seq 1 8); do
            code=$(curl --silent --show-error -o "$stream" -w '%{http_code}' \
              -H "Authorization: Bearer $EVE_TOKEN" "$EVE_URL/eve/v1/session/$session_id/stream")
            [[ "$code" = 200 ]] && break
            sleep 1
          done
          [[ "${code:-}" = 200 ]]
          jq -c 'if .type=="message.received" then .data.parts |= map(if .type=="file" then .url="[inline attachment redacted]" else . end) else . end' "$stream" > "$stream.redacted"
          mv "$stream.redacted" "$stream"
          if grep -Eq '"type":"(turn|session)\.failed"' "$stream"; then
            echo "eve turn failed" >&2
            tail -20 "$stream" >&2
            exit 1
          fi
          finish=$(grep '"type":"action.result"' "$stream" | jq -sc '[.[] | select(.data.result.toolName=="finish_run" and (.data.result.isError // false | not))] | last')
          test "$finish" != "null"
          passed=$(jq -r '.data.result.output.passed' <<<"$finish")
          changed=$(jq -c '.data.result.output.changedFiles' <<<"$finish")
          message=$(grep '"type":"message.completed"' "$stream" | jq -sr 'last.data.message // ""')
          jq -n --arg sessionId "$session_id" --argjson passed "$passed" --argjson changedFiles "$changed" --arg message "$message" \
            '{sessionId:$sessionId,passed:$passed,changedFiles:$changedFiles,message:$message}' > "$RUNNER_TEMP/eve-result.json"
          cat "$RUNNER_TEMP/eve-result.json"
          test "$passed" = true

      - name: Publish summary
        if: always() && steps.eve.outputs.session_id != ''
        env:
          SESSION_ID: ${{ steps.eve.outputs.session_id }}
          EVE_URL: ${{ vars.EVE_WIND_TUNNEL_URL }}
          EXPERIMENT: ${{ inputs.experiment }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          {
            echo "## eve Wind Tunnel"
            echo
            echo "- Session: \`$SESSION_ID\`"
            echo "- Source: \`$SHA\`"
            echo "- Experiment: \`$EXPERIMENT\`"
            echo "- Runtime: eve 0.52.5 + Vercel Workflow + Vercel Sandbox"
            echo "- Endpoint: $EVE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-wind-tunnel-${{ steps.eve.outputs.session_id || github.run_id }}
          path: |
            ${{ runner.temp }}/eve-result.json
            ${{ runner.temp }}/eve-events.ndjson
          if-no-files-found: warn
          retention-days: 30
