name: Run eve Wind Tunnel

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: number
      experiment:
        description: Repo-relative experiment definition
        required: true
        default: experiments/luna-operability/experiment-02-marketing-consent.json
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve exact PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          sha=$(jq -r '.head.sha' <<<"$response")
          repo=$(jq -r '.head.repo.full_name' <<<"$response")
          test "$repo" = "$GITHUB_REPOSITORY"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Checkout exact source snapshot
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.sha }}

      - name: Validate and archive source
        env:
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          node scripts/lint-wind-tunnel-experiments.mjs "$EXPERIMENT"
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD

      - name: Run isolated eve agent
        id: eve
        env:
          EVE_URL: ${{ vars.EVE_WIND_TUNNEL_URL }}
          EVE_TOKEN: ${{ secrets.WIND_TUNNEL_TOKEN }}
          SUBJECT_REPO: ${{ steps.pr.outputs.repo }}
          SUBJECT_SHA: ${{ steps.pr.outputs.sha }}
          EXPERIMENT: ${{ inputs.experiment }}
        run: |
          set -euo pipefail
          test -n "$EVE_URL"
          test -n "$EVE_TOKEN"
          archive=$(base64 -w 0 "$RUNNER_TEMP/source.tar.gz")
          archive_sha256=$(sha256sum "$RUNNER_TEMP/source.tar.gz" | cut -d' ' -f1)
          jq -nc \
            --arg archiveBase64 "$archive" \
            --arg archiveSha256 "$archive_sha256" \
            --arg operationId "$GITHUB_REPOSITORY:$GITHUB_RUN_ID:$GITHUB_RUN_ATTEMPT" \
            --arg repository "$SUBJECT_REPO" \
            --arg sourceSha "$SUBJECT_SHA" \
            --arg experimentPath "$EXPERIMENT" \
            --arg workflowRunId "$GITHUB_RUN_ID" \
            --arg workflowRunAttempt "$GITHUB_RUN_ATTEMPT" \
            '{operationId:$operationId,repository:$repository,sourceSha:$sourceSha,experimentPath:$experimentPath,archiveBase64:$archiveBase64,archiveSha256:$archiveSha256,trigger:{provider:"github-actions",workflowRunId:$workflowRunId,workflowRunAttempt:$workflowRunAttempt}}' \
            > "$RUNNER_TEMP/eve-request.json"
          response=$(curl --fail --silent --show-error \
            -X POST -H "Authorization: Bearer $EVE_TOKEN" -H "Content-Type: application/json" \
            "$EVE_URL/api/runs" --data-binary @"$RUNNER_TEMP/eve-request.json")
          run_id=$(jq -r '.runId' <<<"$response")
          session_id=$(jq -r '.sessionId' <<<"$response")
          [[ "$run_id" =~ ^[0-9a-f-]{36}$ ]]
          [[ "$session_id" == wrun_* ]]
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "session_id=$session_id" >> "$GITHUB_OUTPUT"
          detail="$RUNNER_TEMP/eve-run.json"
          for attempt in $(seq 1 300); do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer $EVE_TOKEN" "$EVE_URL/api/runs/$run_id" > "$detail"
            status=$(jq -r '.run.status' "$detail")
            [[ "$status" =~ ^(completed|failed|cancelled)$ ]] && break
            sleep 2
          done
          jq -c '.events[] | if .type=="message.received" then .data.parts |= map(if .type=="file" then .url="[inline attachment redacted]" else . end) else . end' "$detail" > "$RUNNER_TEMP/eve-events.ndjson"
          [[ "$status" = completed ]]
          finish=$(jq -c '[.events[] | select(.type=="action.result" and .data.result.toolName=="finish_run" and (.data.result.isError // false | not))] | last' "$detail")
          test "$finish" != "null"
          passed=$(jq -r '.data.result.output.passed' <<<"$finish")
          changed=$(jq -c '.data.result.output.changedFiles' <<<"$finish")
          message=$(jq -r '[.events[] | select(.type=="message.completed")] | last.data.message // ""' "$detail")
          jq -n --arg sessionId "$session_id" --argjson passed "$passed" --argjson changedFiles "$changed" --arg message "$message" \
            '{sessionId:$sessionId,passed:$passed,changedFiles:$changedFiles,message:$message}' > "$RUNNER_TEMP/eve-result.json"
          cat "$RUNNER_TEMP/eve-result.json"
          test "$passed" = true

      - name: Publish summary
        if: always() && steps.eve.outputs.session_id != ''
        env:
          SESSION_ID: ${{ steps.eve.outputs.session_id }}
          EVE_URL: ${{ vars.EVE_WIND_TUNNEL_URL }}
          EXPERIMENT: ${{ inputs.experiment }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          {
            echo "## eve Wind Tunnel"
            echo
            echo "- Session: \`$SESSION_ID\`"
            echo "- Source: \`$SHA\`"
            echo "- Experiment: \`$EXPERIMENT\`"
            echo "- Runtime: eve 0.52.5 + Vercel Workflow + Vercel Sandbox"
            echo "- Endpoint: $EVE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eve-wind-tunnel-${{ steps.eve.outputs.session_id || github.run_id }}
          path: |
            ${{ runner.temp }}/eve-result.json
            ${{ runner.temp }}/eve-events.ndjson
          if-no-files-found: warn
          retention-days: 30
