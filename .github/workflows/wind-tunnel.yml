name: Run Wind Tunnel

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to test
        required: true
        type: number
      experiment:
        description: Repo-relative experiment definition
        required: true
        default: experiments/luna-operability/experiment-02-marketing-consent.json
        type: string
      arm:
        description: Experiment arm
        required: true
        default: nazare
        type: choice
        options:
          - nazare
          - raw

permissions:
  contents: read
  pull-requests: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve exact PR head SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          sha=$(jq -r '.head.sha' <<<"$response")
          repo=$(jq -r '.head.repo.full_name' <<<"$response")
          if [[ "$repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Wind Tunnel runs are currently restricted to same-repository PR branches." >&2
            exit 1
          fi
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve an exact PR head SHA." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Start Wind Tunnel run
        id: start
        env:
          WIND_TUNNEL_URL: ${{ secrets.WIND_TUNNEL_URL }}
          WIND_TUNNEL_TOKEN: ${{ secrets.WIND_TUNNEL_TOKEN }}
          SUBJECT_REPO: ${{ steps.pr.outputs.repo }}
          SUBJECT_SHA: ${{ steps.pr.outputs.sha }}
          EXPERIMENT: ${{ inputs.experiment }}
          ARM: ${{ inputs.arm }}
        run: |
          set -euo pipefail
          test -n "$WIND_TUNNEL_URL"
          test -n "$WIND_TUNNEL_TOKEN"
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WIND_TUNNEL_TOKEN" \
            -H "Content-Type: application/json" \
            "$WIND_TUNNEL_URL/runs" \
            --data "$(jq -nc \
              --arg repository "$SUBJECT_REPO" \
              --arg sourceSha "$SUBJECT_SHA" \
              --arg experiment "$EXPERIMENT" \
              --arg arm "$ARM" \
              '{repository:$repository,sourceSha:$sourceSha,experiment:$experiment,arm:$arm}')")
          run_id=$(jq -r '.runId' <<<"$response")
          test -n "$run_id"
          test "$run_id" != "null"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Started Wind Tunnel run $run_id"

      - name: Wait for result
        id: result
        env:
          WIND_TUNNEL_URL: ${{ secrets.WIND_TUNNEL_URL }}
          WIND_TUNNEL_TOKEN: ${{ secrets.WIND_TUNNEL_TOKEN }}
          RUN_ID: ${{ steps.start.outputs.run_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            response=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $WIND_TUNNEL_TOKEN" \
              "$WIND_TUNNEL_URL/runs/$RUN_ID")
            status=$(jq -r '.status' <<<"$response")
            outcome=$(jq -r '.outcome // ""' <<<"$response")
            elapsed=$(jq -r '.elapsedMs // 0' <<<"$response")
            echo "[$attempt] status=$status outcome=${outcome:-pending} elapsedMs=$elapsed"

            case "$status" in
              completed|failed|cancelled)
                echo "status=$status" >> "$GITHUB_OUTPUT"
                echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
                echo "elapsed_ms=$elapsed" >> "$GITHUB_OUTPUT"
                echo "$response" > "$RUNNER_TEMP/wind-tunnel-result.json"
                break
                ;;
            esac
            sleep 10
          done

          if [[ ! -f "$RUNNER_TEMP/wind-tunnel-result.json" ]]; then
            echo "Wind Tunnel run did not finish within the workflow polling window." >&2
            exit 1
          fi

      - name: Publish summary
        if: always() && steps.start.outputs.run_id != ''
        env:
          RUN_ID: ${{ steps.start.outputs.run_id }}
          SHA: ${{ steps.pr.outputs.sha }}
          EXPERIMENT: ${{ inputs.experiment }}
          ARM: ${{ inputs.arm }}
          STATUS: ${{ steps.result.outputs.status }}
          OUTCOME: ${{ steps.result.outputs.outcome }}
          ELAPSED_MS: ${{ steps.result.outputs.elapsed_ms }}
        run: |
          {
            echo "## Wind Tunnel"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Run | \`$RUN_ID\` |"
            echo "| PR | #${{ inputs.pr }} |"
            echo "| SHA | \`$SHA\` |"
            echo "| Experiment | \`$EXPERIMENT\` |"
            echo "| Arm | \`$ARM\` |"
            echo "| Status | ${STATUS:-unknown} |"
            echo "| Outcome | ${OUTCOME:-pending} |"
            echo "| Elapsed | ${ELAPSED_MS:-0} ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce verdict
        if: steps.result.outputs.status != ''
        env:
          STATUS: ${{ steps.result.outputs.status }}
          OUTCOME: ${{ steps.result.outputs.outcome }}
        run: |
          if [[ "$STATUS" != "completed" || "$OUTCOME" != "pass" ]]; then
            echo "Wind Tunnel verdict: status=$STATUS outcome=$OUTCOME" >&2
            exit 1
          fi
